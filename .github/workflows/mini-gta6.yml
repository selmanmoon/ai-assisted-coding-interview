name: mini-gta6

on:
  push:
    paths: ["mini-gta6/**", ".github/workflows/mini-gta6.yml"]
  pull_request:
    paths: ["mini-gta6/**", ".github/workflows/mini-gta6.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-gta6
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
